<!DOCTYPE html>

        .navbar { background-color: #1A1A1A; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222222; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
        .purple-line { height: 2px; background-color: #5E35B1; width: 100%; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; }

        .section-title { font-size: 14px; font-weight: bold; text-transform: uppercase; color: #888888; margin-top: 0; margin-bottom: 15px; letter-spacing: 1px; }
        .build-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2A2A2A; }
        .build-row:last-child { border-bottom: none; }
        .version { font-weight: bold; font-size: 15px; }
        .author { color: #666666; font-size: 12px; margin-top: 2px; }
        .date { color: #666666; font-size: 12px; }
        .btn { display: block; width: 100%; background-color: #1A1A1A; border: 1px solid #5E35B1; color: white; padding: 14px; text-align: center; font-weight: bold; text-decoration: none; margin-top: 15px; box-sizing: border-box; font-size: 15px; }
